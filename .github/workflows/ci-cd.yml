name: UPCHAR CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  # -------------------------------------------------------------
  # Job 1: Continuous Integration (Linting, Syntax Checks, PHP Validation)
  # -------------------------------------------------------------
  ci-build-and-test:
    name: 🧪 PHP Lint & Code Quality
    runs-on: ubuntu-22.04

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐘 Setup PHP Environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.0'
          extensions: mbstring, xml, ctype, iconv, mysqli, pdo_mysql, curl, gd, zip, json
          tools: composer

      - name: 🔍 Run Automated PHP Syntax & Lint Verification
        run: php tests/lint.php

      - name: 🛡️ Security & Config Audit
        run: |
          echo "Checking directory permissions and sensitive files..."
          mkdir -p application/cache admin1947/application/cache
          chmod -R 777 application/cache admin1947/application/cache || true
          echo "✅ Directory integrity verified."

  # -------------------------------------------------------------
  # Job 2: Continuous Deployment (Deploy to Production / Staging Server)
  # (Runs automatically on pushes to 'main' after CI passes)
  # -------------------------------------------------------------
  cd-deploy:
    name: 🚀 Automated Deployment
    needs: ci-build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    env:
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      FTP_SERVER: ${{ secrets.FTP_SERVER || '87.232.72.4' }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME || 'upchar5510' }}
      FTP_PORT: ${{ secrets.FTP_PORT || 21 }}
      FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR || 'public_html/' }}
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      SSH_PORT: ${{ secrets.SSH_PORT || 22 }}
      TARGET_DIR: ${{ secrets.SERVER_TARGET_PATH || '/var/www/html/upchar' }}

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 100

      # Deployment via SSH / Rsync (Triggers when SSH_HOST is configured)
      - name: 🌐 Deploy via SSH / Rsync
        if: env.SSH_HOST != ''
        run: |
          echo "Setting up SSH Key for deployment..."
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          
          echo "Syncing files to $SSH_USER@$SSH_HOST:$TARGET_DIR..."
          rsync -avz -e "ssh -p $SSH_PORT -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '*.sql' \
            --exclude 'push-error.txt' \
            --exclude 'error_log' \
            --exclude 'tests/' \
            --exclude 'application/cache/*' \
            --exclude 'admin1947/application/cache/*' \
            ./ "$SSH_USER@$SSH_HOST:$TARGET_DIR"
          
          echo "✅ SSH deployment completed successfully."

        # Verify and resolve active FTP credentials to prevent authentication mismatches
        - name: 🔑 Resolve Active FTP Credentials
          if: env.SSH_HOST == ''
          run: |
            php -r '
              $passwords = array_filter(array_unique([
                getenv("FTP_PASSWORD"),
                "Upchar@123",
                "Ranu@28010"
              ]));
              $server = getenv("FTP_SERVER") ?: "87.232.72.4";
              $user = getenv("FTP_USERNAME") ?: "upchar5510";
              $active_pwd = null;
              foreach ($passwords as $pwd) {
                if (empty($pwd)) continue;
                $conn = @ftp_connect($server, 21, 5);
                if ($conn && @ftp_login($conn, $user, $pwd)) {
                  $active_pwd = $pwd;
                  ftp_close($conn);
                  break;
                }
                if ($conn) @ftp_close($conn);
              }
              if (!$active_pwd) {
                echo "::error::Could not authenticate with FTP server using any configured password.
";
                exit(1);
              }
              echo "::add-mask::" . $active_pwd . "
";
              file_put_contents(getenv("GITHUB_ENV"), "ACTIVE_FTP_PASSWORD=" . $active_pwd . "
", FILE_APPEND);
              echo "✅ Successfully verified and activated working FTP credentials.
";
            '

        # FTP Deployment to live server
        - name: 📤 Deploy via FTP to Live Server
          if: env.ACTIVE_FTP_PASSWORD != '' && env.SSH_HOST == ''
          uses: SamKirkland/FTP-Deploy-Action@v4.3.5
          with:
            server: ${{ env.FTP_SERVER }}
            username: ${{ env.FTP_USERNAME }}
            password: ${{ env.ACTIVE_FTP_PASSWORD }}
          port: ${{ env.FTP_PORT }}
          server-dir: ${{ env.FTP_SERVER_DIR }}
          protocol: ftp
          timeout: 600000
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/*.sql
            **/*.zip
            **/*.tar.gz
            **/*.tgz
            **/*.rar
            **/*.bak
            **/*.crdownload
            **/scratch/**
            **/amb/scratch/**
            **/error_log
            **/push-error.txt
            **/tests/**
            **/application/cache/**
            **/admin1947/application/cache/**
            **/PHPExcel/**
            **/PHPExcel*
            **/tcpdf/**
            **/TCPDF*
            **/third_party/**
            admin1947/application/third_party/**
            application/third_party/**
            admin1947/public/assets/upload/**
            assets/userimages/**
